<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agente de Órdenes de Compra SAP</title>
    <style>
      :root {
        --fondo: #0f172a;
        --panel: #1e293b;
        --panel-claro: #334155;
        --texto: #e2e8f0;
        --acento: #38bdf8;
        --ok: #22c55e;
        --alerta: #f59e0b;
        --error: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--fondo);
        color: var(--texto);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 14px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-claro);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .estado { font-size: 12px; color: #94a3b8; margin-left: auto; }
      main { flex: 1; overflow-y: auto; padding: 20px; }
      .contenedor { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      .burbuja { padding: 12px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
      .usuario { background: #1d4ed8; align-self: flex-end; max-width: 80%; }
      .agente { background: var(--panel); border: 1px solid var(--panel-claro); }
      .agente table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
      .agente th, .agente td { border: 1px solid var(--panel-claro); padding: 5px 8px; text-align: left; }
      .agente code { background: #0b1220; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      details.tool {
        background: #0b1220;
        border: 1px solid var(--panel-claro);
        border-left: 3px solid var(--acento);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
      }
      details.tool summary { cursor: pointer; color: var(--acento); font-weight: 600; }
      details.tool pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; color: #cbd5e1; font-size: 12px; }
      .confirmacion {
        background: #422006;
        border: 1px solid var(--alerta);
        border-left: 4px solid var(--alerta);
        border-radius: 10px;
        padding: 12px 14px;
        color: #fde68a;
        font-weight: 600;
      }
      .error { background: #450a0a; border: 1px solid var(--error); color: #fecaca; }
      footer { border-top: 1px solid var(--panel-claro); background: var(--panel); padding: 12px 20px; }
      form { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
      input[type="text"] {
        flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--panel-claro);
        background: #0b1220; color: var(--texto); font-size: 14px;
      }
      button { padding: 12px 18px; border-radius: 10px; border: none; background: var(--acento); color: #06202b; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .sugerencias { max-width: 900px; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; }
      .sugerencias button { background: var(--panel-claro); color: var(--texto); font-weight: 500; font-size: 12px; padding: 6px 10px; }
      .pensando { color: #94a3b8; font-style: italic; }
    </style>
  </head>
  <body>
    <header>
      <h1>Agente de Órdenes de Compra SAP</h1>
      <span class="estado" id="estado">verificando…</span>
    </header>

    <main>
      <div class="contenedor" id="chat"></div>
    </main>

    <footer>
      <div class="sugerencias">
        <button type="button" data-sugerencia="Procesa la solicitud &quot;sol-004&quot;. Muéstrame la OC como quedaría en SAP, qué validaciones pasó y cuáles no, y no la crees hasta que yo lo confirme.">
          sol-004 (confirmación)
        </button>
        <button type="button" data-sugerencia="Procesa sol-002 y dime por qué no se puede crear la orden.">sol-002 (bloqueo)</button>
        <button type="button" data-sugerencia="Procesa sol-005 y dime si es retroactiva.">sol-005 (retroactiva)</button>
        <button type="button" data-sugerencia="Procesa sol-001 de principio a fin.">sol-001 (flujo limpio)</button>
      </div>
      <form id="formulario">
        <input type="text" id="entrada" placeholder="Escribe tu mensaje… (ej. procesa sol-001)" autocomplete="off" />
        <button type="submit" id="enviar">Enviar</button>
      </form>
    </footer>

    <script>
      const chat = document.getElementById("chat")
      const formulario = document.getElementById("formulario")
      const entrada = document.getElementById("entrada")
      const enviar = document.getElementById("enviar")
      const estado = document.getElementById("estado")
      const sessionId = crypto.randomUUID()
      let esperandoConfirmacion = false

      async function saludar() {
        try {
          const r = await fetch("/api/health")
          const datos = await r.json()
          estado.textContent = datos.llm_configured
            ? `${datos.provider} · ${datos.model}`
            : "LLM sin configurar (faltan LLM_API_KEY en .env)"
          if (!datos.llm_configured) {
            agregarBurbuja(
              "El servidor está arriba, pero no hay clave del proveedor LLM. Defina LLM_API_KEY en .env y reinicie. La verificación sin modelo corre con `npm run demo`.",
              "agente error",
            )
          }
        } catch {
          estado.textContent = "servidor sin responder"
        }
      }

      function agregarBurbuja(texto, clase) {
        const div = document.createElement("div")
        div.className = `burbuja ${clase}`
        div.innerHTML = texto
        chat.appendChild(div)
        chat.scrollIntoView({ block: "end" })
        return div
      }

      function agregarToolCalls(toolCalls) {
        for (const llamada of toolCalls) {
          const detalle = document.createElement("details")
          detalle.className = "tool"
          const resumen = llamada.ok ? "ok" : "error"
          detalle.innerHTML = `<summary>${llamada.nombre} — ${resumen}</summary><pre>${escapar(
            JSON.stringify({ argumentos: llamada.argumentos, resultado: llamada.resultado }, null, 2),
          )}</pre>`
          chat.appendChild(detalle)
        }
      }

      function escapar(texto) {
        return String(texto).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])
      }

      async function enviarMensaje(texto) {
        if (!texto.trim()) return
        agregarBurbuja(escapar(texto), "burbuja usuario")
        entrada.value = ""
        enviar.disabled = true
        const pensando = agregarBurbuja("pensando…", "burbuja agente pensando")

        try {
          const r = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, message: texto }),
          })
          const datos = await r.json()
          pensando.remove()

          if (!datos.ok) {
            agregarBurbuja(`⚠️ ${escapar(datos.error)}`, "burbuja agente error")
            return
          }

          agregarToolCalls(datos.toolCalls || [])
          agregarBurbuja(formatear(datos.reply), "burbuja agente")

          if (datos.needsConfirmation) {
            esperandoConfirmacion = true
            agregarBurbuja(
              "⏸️ El agente espera tu confirmación explícita antes de crear la orden. Responde «confirmo» para continuar.",
              "confirmacion",
            )
          }
        } catch (e) {
          pensando.remove()
          agregarBurbuja(`⚠️ No se pudo contactar al servidor: ${escapar(e.message)}`, "burbuja agente error")
        } finally {
          enviar.disabled = false
          entrada.focus()
        }
      }

      // Minimal Markdown: bold, inline code, tables and line breaks.
      function formatear(texto) {
        let html = escapar(texto)
        html = html.replace(/```([\s\S]*?)```/g, "<pre>$1</pre>")
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>")
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        const lineas = html.split("\n")
        const salida = []
        let tabla = []
        for (const linea of lineas) {
          if (/^\s*\|(.+)\|\s*$/.test(linea)) {
            tabla.push(linea)
            continue
          }
          if (tabla.length > 0) { salida.push(renderTabla(tabla)); tabla = [] }
          salida.push(linea)
        }
        if (tabla.length > 0) salida.push(renderTabla(tabla))
        return salida.join("<br>").replace(/<\/table><br>/g, "</table>").replace(/<br><table>/g, "<table>")
      }

      function renderTabla(lineas) {
        const filas = lineas
          .filter((l) => !/^\s*\|[\s\-:|]+\|\s*$/.test(l))
          .map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()))
        if (filas.length === 0) return ""
        const cabecera = filas[0]
        const cuerpo = filas.slice(1)
        const th = cabecera.map((c) => `<th>${c}</th>`).join("")
        const trs = cuerpo.map((f) => `<tr>${f.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")
        return `<table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>`
      }

      formulario.addEventListener("submit", (evento) => {
        evento.preventDefault()
        enviarMensaje(entrada.value)
      })

      document.querySelectorAll("[data-sugerencia]").forEach((boton) => {
        boton.addEventListener("click", () => enviarMensaje(boton.dataset.sugerencia || ""))
      })

      saludar()
    </script>
  </body>
</html>
